<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8cb69d"/></marker></defs><rect width="1100" height="390" rx="18" fill="#102b2a"/><g font-family="system-ui,sans-serif" fill="#e6edde"><text x="42" y="50" font-size="24" font-weight="700">Dos controles que trabajan juntos</text><g fill="#193e35" stroke="#709d80"><rect x="40" y="85" width="300" height="105" rx="12"/><rect x="400" y="85" width="300" height="105" rx="12"/><rect x="760" y="85" width="300" height="105" rx="12"/></g><g font-size="18" font-weight="650"><text x="60" y="117">Contrato: cantidad / límite</text><text x="420" y="117">Servidor: política acotada</text><text x="780" y="117">Juego: entrega confirmada</text></g><g font-size="15" fill="#bcd2c4"><text x="60" y="148">Límite global y por factura</text><text x="60" y="174">La cadena rechaza exceso de emisión</text><text x="420" y="148">Menos capacidad → más espera</text><text x="420" y="174">Precios con margen y tope diario</text><text x="780" y="148">Nodo reclamado una sola vez</text><text x="780" y="174">Sin entrega inventada por el cliente</text></g><path d="M345 138H390M705 138H750" stroke="#8cb69d" stroke-width="3" marker-end="url(#a)"/><text x="42" y="247" font-size="19" font-weight="650">Acuñar: Q sube · consumir o quemar: Q baja · transferir P2P: Q se conserva</text><text x="42" y="284" font-size="16" fill="#bcd2c4">Las monedas usan otro libro: jugadores + tesoro circular + tesoro del juego.</text><text x="42" y="315" font-size="16" fill="#bcd2c4">Una quema de recursos no financia recompensas ni repone el dinero del tesoro.</text><text x="42" y="354" font-size="15" fill="#e3c68d">Excepción privilegiada: ampliar límites o importar con migración abierta requiere revisión del propietario.</text></g></svg>