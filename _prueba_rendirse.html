<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba: boton de rendirse</title>
<link rel="stylesheet" href="styless.css">
<style>
  body { margin:0; background: linear-gradient(180deg,#2b6f4a,#7cb87a 60%,#4a7a3c); }
  .nota { position:fixed; left:8px; bottom:8px; z-index:5000; font:12px system-ui;
          background:#000a; color:#fff; padding:6px 10px; border-radius:8px; }
</style></head><body>
<div id="battleUI" class="battle-ui hidden">

  <!-- ===== Barra superior: marcadores + turno con temporizador ===== -->
  <div class="bf-topbar">
    <div class="bf-card bf-you">
      <div class="bf-portrait" id="bfYouPortrait">🐾</div>
      <div class="bf-cardbody">
        <div class="bf-top">
          <span class="bf-name" id="bfYouName">—</span>
          <span class="bf-lvl" id="bfYouLvl"></span>
        </div>
        <div class="bf-sub"><span id="bfYouPlayer"></span> <span class="bf-addr" id="bfYouAddr"></span></div>
        <div class="bf-hpbar"><i id="bfYouHp" style="width:100%"></i><b class="bf-shieldbar" id="bfYouShieldBar"></b></div>
        <div class="bf-hptext"><span id="bfYouHpTxt">—</span><span class="bf-shield" id="bfYouShield"></span></div>
      </div>
    </div>

    <div class="bf-turnbox">
      <div class="bf-turnlabel" id="bfTurnLabel">VS</div>
      <div class="bf-timer" id="bfTimer"><i id="bfTimerFill"></i></div>
      <div class="bf-timertext" id="bfTimerText"></div>
      <!-- RENDIRSE, SIEMPRE A MANO.
           Este va en la barra de arriba a proposito: la de abajo (.bf-bottom)
           la comparte con la mano de cartas y en horizontal se aprieta, ademas
           de que al terminar el combate el jugador ya no mira ahi. Este chip se
           ve en las tres fases (buscando rival, combate y final) y no lo tapa
           ninguna carta. Pide confirmacion pulsando dos veces. -->
      <button id="bfSurrender" class="bf-surrender" type="button">Surrender</button>
    </div>

    <div class="bf-card bf-rival">
      <div class="bf-cardbody bf-rightbody">
        <div class="bf-top">
          <span class="bf-lvl" id="bfRivalLvl"></span>
          <span class="bf-name" id="bfRivalName">—</span>
        </div>
        <div class="bf-sub"><span class="bf-addr" id="bfRivalAddr"></span> <span id="bfRivalPlayer"></span></div>
        <div class="bf-hpbar bf-hpbar-rival"><i id="bfRivalHp" style="width:100%"></i><b class="bf-shieldbar" id="bfRivalShieldBar"></b></div>
        <div class="bf-hptext bf-right"><span class="bf-shield" id="bfRivalShield"></span><span id="bfRivalHpTxt">—</span></div>
      </div>
      <div class="bf-portrait bf-portrait-rival" id="bfRivalPortrait">🐾</div>
    </div>
  </div>

  <!-- ===== Estado grande (buscando, resultado…) ===== -->
  <div class="bf-status" id="bfStatus">Searching for an opponent…</div>

  <!-- ===== Reveal de cartas jugadas (aparece unos segundos y se va) ===== -->
  <div class="bf-reveal hidden" id="bfReveal">
    <div class="bf-reveal-side bf-reveal-you"><div class="bf-reveal-label">YOU</div><div class="bf-reveal-cards" id="bfRevealYou"></div></div>
    <div class="bf-reveal-vs">⚔</div>
    <div class="bf-reveal-side bf-reveal-rival"><div class="bf-reveal-label">RIVAL</div><div class="bf-reveal-cards" id="bfRevealRival"></div></div>
  </div>

  <!-- ===== Capa de números flotantes de daño/cura ===== -->
  <div class="bf-floaters" id="bfFloaters"></div>

  <!-- ===== Parte inferior: energía (a un lado) + mano de cartas ===== -->
  <div class="bf-bottom">
    <div class="bf-energywrap">
      <div class="bf-energy-title">ENERGY</div>
      <div class="bf-energy" id="bfEnergy" aria-label="Energy"></div>
      <div class="bf-energy-count" id="bfEnergyCount">3 / 3</div>
    </div>

    <div class="bf-hand" id="bfHand"></div>

    <div class="bf-actions">
      <button id="bfEndTurn" class="bf-btn bf-btn-main" disabled>End turn</button>
      <!-- Decia "Leave", que se lee como "salir" y no como "rendirse", aunque
           siempre llamo a rendirse(). Ahora dice lo que hace. -->
      <button id="bfLeave" class="bf-btn bf-btn-ghost">Surrender</button>
    </div>
  </div>
</div>
<div class="nota" id="nota">pulsa "Surrender"</div>
<script>
  document.getElementById('battleUI').classList.remove('hidden');
  document.getElementById('bfStatus').textContent = 'Choose your cards';
  document.getElementById('bfYouName').textContent = 'Rex';
  document.getElementById('bfYouLvl').textContent = 'Lv.10';
  document.getElementById('bfRivalName').textContent = 'Gnash';
  document.getElementById('bfRivalLvl').textContent = 'Lv.12';
  document.getElementById('bfTurnLabel').textContent = 'TURN 3';
  document.getElementById('bfTimerText').textContent = '14s';
  document.getElementById('bfTimerFill').style.width = '70%';
  document.getElementById('bfYouHpTxt').textContent = '160 / 200';
  document.getElementById('bfRivalHpTxt').textContent = '210 / 251';
  var mano = document.getElementById('bfHand');
  ['Bite','Guard','Howl','Dash','Heal'].forEach(function (n) {
    var b = document.createElement('button');
    b.className = 'bf-cardbtn';
    b.innerHTML = '<div class="c-emoji">*</div><div class="c-name">' + n + '</div>' +
                  '<div class="c-desc">Deal 24</div>';
    mano.appendChild(b);
  });
  document.getElementById('bfEnergyCount').textContent = '3 / 3';

  var confirmando = false, plazo = null, nota = document.getElementById('nota');
  var botones = [document.getElementById('bfSurrender'), document.getElementById('bfLeave')];
  function cancelar() {
    if (plazo) { clearTimeout(plazo); plazo = null; }
    confirmando = false;
    botones.forEach(function (b) { b.classList.remove('confirmar'); b.textContent = 'Surrender'; });
  }
  botones.forEach(function (b) {
    b.addEventListener('click', function () {
      if (confirmando) { cancelar(); nota.textContent = 'RENDIDO -> vuelve al mapa'; return; }
      confirmando = true;
      b.classList.add('confirmar'); b.textContent = 'Confirm?';
      nota.textContent = 'pide confirmacion; vuelve solo en 3,5 s';
      plazo = setTimeout(function () { cancelar(); nota.textContent = 'se cancelo solo'; }, 3500);
    });
  });
</script>
</body></html>
