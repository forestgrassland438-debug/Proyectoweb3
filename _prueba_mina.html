<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prueba: la mina</title>
<!-- =========================================================================
     BANCO DE PRUEBAS DE LA MINA

     Monta el mapa de la mina con Phaser DE VERDAD —las dos capas de tiles, la
     lava animada, el agua y las colisiones— pero SIN el juego alrededor: sin
     login, sin backend, sin blockchain y sin HUD.

     Para que sirve: para mirar el mapa y la lava sin tener que arrancar el
     juego entero e ir andando hasta la puerta de la mina. Si algo sale mal (un
     tile que no encaja, la lava que no corre, una pared con el trozo
     equivocado) se ve aqui en dos segundos.

     Lo que NO prueba: nada del HUD, del inventario ni de la mascota. Eso vive
     en MinaScene y necesita el juego entero.

     Controles: flechas o WASD para volar por el mapa, rueda para el zoom,
     C para pintar las colisiones encima.
     ====================================================================== -->
<style>
  html,body{margin:0;height:100%;background:#0d1117;color:#c9d1d9;
            font:13px system-ui,sans-serif;overflow:hidden}
  #juego{position:absolute;inset:0}
  #panel{position:absolute;left:10px;top:10px;z-index:10;background:rgba(13,17,23,.88);
         border:1px solid #30363d;border-radius:8px;padding:10px 12px;line-height:1.7;
         pointer-events:none;min-width:250px}
  b{color:#58a6ff}
  .k{display:inline-block;background:#21262d;border:1px solid #30363d;border-radius:4px;
     padding:0 5px;font-family:ui-monospace,monospace}
  #estado{color:#7ee787}
  .mal{color:#ff7b72}
</style>
</head>
<body>
<div id="juego"></div>
<div id="panel">
  <b>Prueba de la mina</b><br>
  <span class="k">flechas</span> / <span class="k">WASD</span> volar ·
  <span class="k">rueda</span> zoom ·
  <span class="k">C</span> colisiones<br>
  <span id="estado">cargando…</span><br>
  <span id="datos"></span>
</div>

<script src="./vendor/phaser.min.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };

  if (typeof Phaser === 'undefined') {
    $('estado').className = 'mal';
    $('estado').textContent =
      'Phaser no cargo. Falta vendor/phaser.min.js (es la carpeta que no esta subida al servidor).';
    return;
  }

  var Prueba = new Phaser.Scene('Prueba');

  // Igual que LIQUIDOS_MINA y LUCES_MINA de Scenes/MinaScene.js.
  var LIQUIDOS = { lava: { fotogramas: 6, fps: 6 }, agua: { fotogramas: 4, fps: 4 } };
  var LUCES = {
    lava:           { color: 0xff6418, alfa: 0.42, vibra: 0.10, vel: 1.1 },
    lava_foco:      { color: 0xff9632, alfa: 0.26, vibra: 0.30, vel: 2.3 },
    antorcha:       { color: 0xffa040, alfa: 0.46, vibra: 0.16, vel: 7.0 },
    cristal_azul:   { color: 0x3c9cff, alfa: 0.34, vibra: 0.12, vel: 1.6 },
    cristal_morado: { color: 0xb058ff, alfa: 0.32, vibra: 0.12, vel: 1.4 },
    cristal_verde:  { color: 0x38e08a, alfa: 0.32, vibra: 0.12, vel: 1.5 }
  };

  Prueba.preload = function () {
    // Sin cache: esta pagina es para mirar el arte recien generado.
    var v = '?v=' + Date.now();
    this.load.image('tiles_mina', './Game/MAPAS/Mina/tileset_mina.png' + v);
    this.load.tilemapTiledJSON('mina', './Maps/mina.json' + v);
    var esc = this;
    Object.keys(LIQUIDOS).forEach(function (m) {
      for (var f = 0; f < LIQUIDOS[m].fotogramas; f++) {
        esc.load.image('mina_' + m + '_' + f, './Game/MAPAS/Mina/tileset_' + m + '_' + f + '.png' + v);
      }
    });
    this.load.atlas('piezas_mina', './Game/MAPAS/Mina/piezas.png' + v, './Game/MAPAS/Mina/piezas.json' + v);
    this.load.spritesheet('lava_burbuja', './Game/MAPAS/Mina/lava_burbuja.png' + v,
                          { frameWidth: 32, frameHeight: 32 });
    this.load.on('loaderror', function (f) {
      $('estado').className = 'mal';
      $('estado').textContent = 'no se pudo cargar: ' + f.src;
    });
  };

  Prueba.create = function () {
    var esc = this;

    var mapa = this.make.tilemap({ key: 'mina' });
    // 32, no 16: el tileset se redibujo a 32 px y esta pagina se quedo con
    // la rejilla vieja. Leer el atlas con la rejilla equivocada saca cuartos
    // de tile mezclados, que parece corrupcion del PNG y no lo es.
    var ts = mapa.addTilesetImage('tileset_mina', 'tiles_mina', 32, 32);
    this.textures.get('tiles_mina').setFilter(Phaser.Textures.FilterMode.NEAREST);

    var suelo = mapa.createLayer('mina', ts, 0, 0).setDepth(0);

    // Los liquidos: su tileset, y la imagen que se cambia en cada fotograma.
    var tsBordes = [ts];
    this.liquidos = [];
    Object.keys(LIQUIDOS).forEach(function (m) {
      var t = mapa.addTilesetImage('tileset_' + m, 'mina_' + m + '_0', 32, 32);
      if (!t) return;
      tsBordes.push(t);
      var claves = [];
      for (var f = 0; f < LIQUIDOS[m].fotogramas; f++) {
        esc.textures.get('mina_' + m + '_' + f).setFilter(Phaser.Textures.FilterMode.NEAREST);
        claves.push('mina_' + m + '_' + f);
      }
      esc.liquidos.push({ ts: t, claves: claves, paso: 1000 / LIQUIDOS[m].fps, acc: 0, i: 0 });
    });
    var bordes = mapa.createLayer('mina_bordes', tsBordes, 0, 0);
    if (bordes) bordes.setDepth(0.5);
    var sombras = mapa.createLayer('mina_sombras', ts, 0, 0);
    if (sombras) sombras.setDepth(1);
    var objetos = mapa.createLayer('mina_objetos', ts, 0, 0).setDepth(2);

    // Las piezas altas, ordenadas por su base (sin gf-profundidad aqui).
    var piezas = mapa.getObjectLayer('piezas');
    (piezas ? piezas.objects : []).forEach(function (o) {
      if (o.name && esc.textures.get('piezas_mina').has(o.name)) {
        esc.add.image(o.x, o.y, 'piezas_mina', o.name).setOrigin(0.5, 1).setDepth(10 + o.y);
      }
    });

    // Burbujas
    this.anims.create({
      key: 'burbuja',
      frames: this.anims.generateFrameNumbers('lava_burbuja', { start: 0, end: 5 }),
      frameRate: 9, repeat: 0
    });
    var trozos = mapa.getObjectLayer('area_lava_interior').objects;
    function recolocar(spr) {
      var t = trozos[Phaser.Math.Between(0, trozos.length - 1)];
      spr.setPosition(t.x + Phaser.Math.Between(0, Math.max(0, t.width - 32)) + 16,
                      t.y + Phaser.Math.Between(0, Math.max(0, t.height - 32)) + 16);
      spr.setVisible(true).play('burbuja');
    }
    for (var i = 0; i < 8; i++) {
      (function (k) {
        var b = esc.add.sprite(0, 0, 'lava_burbuja', 0).setDepth(6).setVisible(false);
        b.on('animationcomplete', function () {
          b.setVisible(false);
          esc.time.delayedCall(Phaser.Math.Between(400, 2200), function () { recolocar(b); });
        });
        esc.time.delayedCall(k * 260 + 200, function () { recolocar(b); });
      })(i);
    }

    // Las luces, como en la escena.
    var lz = this.textures.createCanvas('mina_luz', 128, 128);
    var cx = lz.getContext();
    var gr = cx.createRadialGradient(64, 64, 2, 64, 64, 64);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.25, 'rgba(255,255,255,0.55)');
    gr.addColorStop(0.55, 'rgba(255,255,255,0.18)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    cx.fillStyle = gr; cx.fillRect(0, 0, 128, 128); lz.refresh();
    this.luces = [];
    var capaLuces = mapa.getObjectLayer('luces');
    (capaLuces ? capaLuces.objects : []).forEach(function (o, k) {
      var tl = LUCES[o.name];
      if (!tl) return;
      var img = esc.add.image(o.x + o.width / 2, o.y + o.height / 2, 'mina_luz')
        .setDisplaySize(o.width, o.height).setTint(tl.color).setAlpha(tl.alfa)
        .setDepth(9100).setBlendMode(Phaser.BlendModes.ADD);
      esc.luces.push({ img: img, base: tl.alfa, vibra: tl.vibra, vel: tl.vel, fase: k * 1.7 });
    });

    // Penumbra de cueva, igual que en la escena: una IMAGEN (las figuras
    // ignoran el modo de mezcla) estirada al mapa, en MULTIPLY.
    var pen = this.textures.createCanvas('mina_penumbra', 4, 4);
    pen.getContext().fillStyle = '#4a5a78';
    pen.getContext().fillRect(0, 0, 4, 4);
    pen.refresh();
    this.add.image(0, 0, 'mina_penumbra').setOrigin(0, 0)
      .setDisplaySize(mapa.widthInPixels, mapa.heightInPixels)
      .setDepth(9000).setAlpha(0.42).setBlendMode(Phaser.BlendModes.MULTIPLY);

    // Colisiones, para verlas con la C.
    this.pintadoColisiones = this.add.graphics().setDepth(9500).setVisible(false);
    this.pintadoColisiones.lineStyle(1, 0xff4444, 0.9);
    var cols = mapa.getObjectLayer('area_colision_general').objects;
    cols.forEach(function (o) { esc.pintadoColisiones.strokeRect(o.x, o.y, o.width, o.height); });
    this.pintadoColisiones.lineStyle(2, 0x44ff88, 1);
    mapa.getObjectLayer('area_salida_mina').objects.forEach(function (o) {
      esc.pintadoColisiones.strokeRect(o.x, o.y, o.width, o.height);
    });

    // La camara arranca donde aparece el jugador, o donde diga la direccion:
    //   _prueba_mina.html#156,272        va a esa casilla
    //   _prueba_mina.html#156,272,1.5    y ademas con ese zoom
    // Asi se puede enlazar un sitio concreto del mapa sin tener que volar.
    var ap = mapa.getObjectLayer('aparicion').objects[0];
    var cam = this.cameras.main;
    cam.setBounds(0, 0, mapa.widthInPixels, mapa.heightInPixels);
    cam.setRoundPixels(true);

    var destino = (location.hash || '').slice(1).split(',').map(Number);
    if (destino.length >= 2 && !isNaN(destino[0]) && !isNaN(destino[1])) {
      cam.setZoom(destino[2] > 0 ? destino[2] : 2);
      // EN PIXELES, no en casillas por 16. Venia de cuando el tileset era de
      // 16 px; con el de 32 multiplicar por 16 te deja a media galeria de
      // donde creias ir, o directamente dentro de la roca.
      cam.centerOn(destino[0], destino[1]);
    } else {
      cam.setZoom(2);
      cam.centerOn(ap.x, ap.y);
    }
    window.__camara = cam;

    // Phaser en modo RESIZE cambia el tamano del LIENZO, pero no el de la
    // camara: sin esto el lienzo ocupaba la ventana entera y el mapa se seguia
    // dibujando en el rectangulo del tamano de arranque, arriba a la
    // izquierda, con el resto en negro.
    this.scale.on('resize', function (tam) {
      cam.setSize(tam.width, tam.height);
    });
    cam.setSize(this.scale.width, this.scale.height);

    this.teclas = this.input.keyboard.addKeys('W,A,S,D,LEFT,RIGHT,UP,DOWN,C');
    this.input.on('wheel', function (p, o, dx, dy) {
      cam.setZoom(Phaser.Math.Clamp(cam.zoom * (dy > 0 ? 0.85 : 1.18), 0.15, 6));
    });
    this.input.keyboard.on('keydown-C', function () {
      esc.pintadoColisiones.setVisible(!esc.pintadoColisiones.visible);
    });

    $('estado').textContent = 'mapa montado';
    $('datos').innerHTML =
      mapa.width + '×' + mapa.height + ' tiles (' + mapa.widthInPixels + ' px)<br>' +
      cols.length + ' rectangulos de colision<br>' +
      trozos.length + ' trozos de lava · ' +
      mapa.getObjectLayer('area_agua').objects.length + ' de agua<br>' +
      'capas de tiles: ' + ((suelo ? 1 : 0) + (bordes ? 1 : 0) + (sombras ? 1 : 0) + (objetos ? 1 : 0)) + ' · ' +
      'liquidos animados: ' + esc.liquidos.length + ' · luces: ' + esc.luces.length;

    // Para que la captura de pantalla de la verificacion no salga con la
    // camara a medio mover.
    window.__minaLista = true;
  };

  Prueba.update = function (t, delta) {
    var cam = this.cameras.main;
    var k = this.teclas;
    if (!k) return;
    var v = 700 * (delta / 1000) / cam.zoom;
    if (k.A.isDown || k.LEFT.isDown) cam.scrollX -= v;
    if (k.D.isDown || k.RIGHT.isDown) cam.scrollX += v;
    if (k.W.isDown || k.UP.isDown) cam.scrollY -= v;
    if (k.S.isDown || k.DOWN.isDown) cam.scrollY += v;

    for (var i = 0; i < this.liquidos.length; i++) {
      var a = this.liquidos[i];
      a.acc += delta;
      if (a.acc >= a.paso) {
        a.acc %= a.paso;
        a.i = (a.i + 1) % a.claves.length;
        a.ts.setImage(this.textures.get(a.claves[a.i]));
      }
    }
    var tt = t / 1000;
    for (var j = 0; j < this.luces.length; j++) {
      var l = this.luces[j];
      var v = Math.sin(tt * l.vel + l.fase) * 0.6 + Math.sin(tt * l.vel * 2.7 + l.fase * 1.3) * 0.4;
      l.img.setAlpha(l.base * (1 + l.vibra * v));
    }
  };

  window.__juego = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'juego',
    backgroundColor: '#0d1117',
    pixelArt: true,
    // RESIZE y no un tamano fijo: asi el lienzo sigue a la ventana. Con
    // width/height fijos, al cambiar el tamano del navegador el mapa se
    // quedaba en un recuadro pequeno en la esquina.
    scale: {
      mode: Phaser.Scale.RESIZE,
      parent: 'juego',
      width: '100%',
      height: '100%'
    },
    scene: Prueba
  });
})();
</script>
</body>
</html>
